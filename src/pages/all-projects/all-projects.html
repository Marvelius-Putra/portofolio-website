<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Devicon — tech stack icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="all-projects.css" />
    <title>All Projects</title>
  </head>
  <body>
    <header id="navbar"></header>
    <div class="all-projects">
      <div class="all-projects-content"></div>

      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-content">
          <div class="page-header-text">
            <h1 class="page-title">All <span class="title-accent">Projects</span></h1>
            <p class="page-description">Explore a collection of projects I've worked on. Each one represents a challenge, solution, and impact.</p>
            <div class="page-cta"></div>
          </div>
          <div class="page-header-illustration">
            <div class="illustration-wrapper">
              <div class="illustration-card floating">
                <i class="fas fa-code"></i>
              </div>
              <div class="illustration-badge">
                <i class="fas fa-star"></i>
              </div>
              <div class="illustration-dots"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Projects Section -->
      <div class="pro-detail">
        <div class="pro-content">
          <div class="pro-type">
            <button class="pro-type-btn active" data-type="all">
              <i class="fas fa-th-large"></i>
              All Projects
            </button>

            <button class="pro-type-btn" data-type="saved">
              <i class="fas fa-bookmark"></i>
              Favorites
            </button>
            <button class="pro-type-btn" data-type="certification">
              <i class="fas fa-certificate"></i>
              Certification
            </button>

            <button class="pro-type-btn" data-type="webApp">
              <i class="fas fa-layer-group"></i>
              Web Application
            </button>

            <button class="pro-type-btn" data-type="mobileApp">
              <i class="fas fa-mobile-screen"></i>
              Mobile Application
            </button>

            <button class="pro-type-btn" data-type="systemDesign">
              <i class="fas fa-diagram-project"></i>
              System Design
            </button>

            <button class="pro-type-btn" data-type="research">
              <i class="fas fa-brain"></i>
              Artificial Intelligence
            </button>
          </div>
          <div class="pro-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search projects..." autocomplete="off" />
          </div>
        </div>

        <div class="pro-list" id="pro-list"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none">
          <i class="fas fa-folder-open"></i>
          <p>No projects found.</p>
          <span>Try a different category or search term.</span>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper">
          <span class="pagination-info" id="paginationInfo"></span>
          <nav class="pagination" id="pagination" aria-label="Project pages"></nav>
          <div class="pagination-perpage">
            <button class="perpage-btn" id="perpageBtn">
              <span id="perpageLabel">6 per page</span>
              <i class="fas fa-chevron-down"></i>
            </button>
            <ul class="perpage-dropdown" id="perpageDropdown">
              <li class="perpage-option active" data-value="6">6 per page <i class="fas fa-check"></i></li>
              <li class="perpage-option" data-value="12">12 per page <i class="fas fa-check"></i></li>
              <li class="perpage-option" data-value="24">24 per page <i class="fas fa-check"></i></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <footer id="contact"></footer>
    <script src="all-projects.js" type="module"></script>
  </body>
</html>
